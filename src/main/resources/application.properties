# Offices: office.<Name>=<number of counters>
office.CivilRegistry=2
office.Police=1
office.TaxOffice=2
office.TownHall=3
office.Notary=1

# Documents: document.<Name>=<issuing office>|<required documents, comma separated>
document.BirthCertificate=CivilRegistry|
document.ResidenceProof=TownHall|
document.IdCard=Police|BirthCertificate,ResidenceProof
document.TaxRecord=TaxOffice|IdCard
document.MarriageCertificate=CivilRegistry|BirthCertificate,IdCard
document.DrivingLicense=Police|IdCard,ResidenceProof
document.PropertyDeed=Notary|IdCard,TaxRecord
document.BuildingPermit=TownHall|PropertyDeed,TaxRecord

# Customers: customer.<Name>=<wanted documents, comma separated>
customer.Alice=BuildingPermit
customer.Bob=DrivingLicense
customer.Carol=MarriageCertificate,TaxRecord
customer.Dan=PropertyDeed
customer.Eve=DrivingLicense
customer.Frank=BuildingPermit,MarriageCertificate
